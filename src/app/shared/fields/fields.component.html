<form class="form">
  <input
    (keyup)="setName(name.value)"
    #name
    class="form__input"
    type="text"
    placeholder="NOMBRE"
  />
  <input
    (keyup)="setBusinessName(bussinesName.value)"
    #bussinesName
    class="form__input"
    type="text"
    placeholder="NOMBRE NEGOCIO"
  />
  <input
    (keyup)="setPhone(phone.value)"
    #phone
    class="form__input"
    type="text"
    placeholder="TELÉFONO"
  />
</form>
