<section class="card">
  <h3 class="card__title">Ayúdanos a elegir los diseños que más te gusten</h3>
  <img class="card__shirt" src="assets/imgs/shirt.jpg" alt="Shirt" />
  <div class="card__content">
    <ng-content></ng-content>
  </div>
  <button
    (click)="next()"
    class="card__button {{ images.length === 0 ? 'disabled' : '' }}"
    [disabled]="images.length === 0"
  >
    {{ button }}
  </button>
</section>
