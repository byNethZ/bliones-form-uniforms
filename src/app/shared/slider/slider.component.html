<div class="design__container">
  <img
    *ngFor="let design of designs"
    (click)="add(design)"
    class="design__image {{ images.includes(design.id) ? 'selected' : '' }}"
    src="{{ design.path }}"
    alt="{{ design.name }}"
  />
</div>
